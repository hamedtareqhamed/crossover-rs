name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release - ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (cross-compilation if needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libxfixes-dev libxext-dev

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p release-pkg
          cp target/${{ matrix.target }}/release/crossover release-pkg/
          cp install.sh release-pkg/
          cp uninstall.sh release-pkg/
          cp README.md release-pkg/
          cp -r assets release-pkg/
          tar -czvf crossover-${{ matrix.target }}.tar.gz -C release-pkg .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: crossover-${{ matrix.target }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
