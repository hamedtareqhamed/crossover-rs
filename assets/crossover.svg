<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="64" fill="#0d1117"/>
  <circle cx="128" cy="128" r="100" fill="url(#grad)" />
  <!-- Outer reticle ring -->
  <circle cx="128" cy="128" r="76" fill="none" stroke="#00ff88" stroke-width="6" stroke-dasharray="100 20"/>
  <!-- Inner precision ring -->
  <circle cx="128" cy="128" r="40" fill="none" stroke="#00ff88" stroke-width="4"/>
  <!-- Crosshair arms -->
  <line x1="128" y1="20" x2="128" y2="70" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
  <line x1="128" y1="186" x2="128" y2="236" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
  <line x1="20" y1="128" x2="70" y2="128" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
  <line x1="186" y1="128" x2="236" y2="128" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="128" cy="128" r="6" fill="#00ff88"/>
</svg>
